<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join as a delivery rider | DaffoMart</title>
  <meta name="description" content="Apply to become a delivery rider for DaffoMart.">
  <meta name="theme-color" content="#1e3a8a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DaffoMart">
  <meta property="og:title" content="Join as a delivery rider | DaffoMart">
  <meta property="og:description" content="Apply to become a delivery rider for DaffoMart.">
  <link rel="icon" href="assets/img/favicon.ico">
  <script>
    /* set dark/light theme BEFORE the page is drawn, so there is no white flash */
    (function () {
      try {
        var t = localStorage.getItem('dm_theme');
        if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (err) { /* private mode: keep light theme */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container main" id="main">

<div class="card form-card narrow">
  <h1>Join as a rider</h1>
  <p class="muted">Deliver groceries and medicine in your area. Send your details and our team will call you.</p>

  <div id="joinError"></div>

  <form id="joinForm" novalidate>
    <label>Full name
      <input type="text" name="name" required autocomplete="name">
    </label>
    <label>Mobile number
      <input type="tel" name="phone" placeholder="01712345678" required autocomplete="tel">
    </label>
    <label>Delivery area
      <input type="text" name="area" placeholder="e.g. Mirpur, Dhaka" required>
    </label>
    <label>Vehicle
      <select name="vehicle">
        <option value="bike">Motorbike</option>
        <option value="cycle">Bicycle</option>
        <option value="walk">On foot</option>
      </select>
    </label>
    <label>Message (optional)
      <textarea name="message" rows="3" maxlength="500"></textarea>
    </label>
    <button class="btn btn-primary btn-block">Send application</button>
  </form>
</div>
</main>

<div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/demo-sdk.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/join.js"></script>
</body>
</html>
