# Netlify publishes ONLY the "site" folder (HTML/CSS/JS). The PHP API (api/ folder) goes to a PHP host, not Netlify.
[build]
  publish = "site"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
