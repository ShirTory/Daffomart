<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order</title>
  <meta name="description" content="Track your DaffoMart order.">
  <link rel="icon" href="/assets/img/favicon.ico">
  <script>
    /* set dark/light theme BEFORE the page is drawn, so there is no white flash */
    (function () { try { var t = localStorage.getItem('dm_theme'); if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container main" id="main">
<h1>Track your order</h1><form id="trackForm" class="card form-card narrow" novalidate>
<label>Order number<input name="no" placeholder="DM-XXXXXXX" required autocomplete="off"></label>
<label>Phone number used at checkout<input type="tel" name="phone" placeholder="01XXXXXXXXX" required></label><button class="btn btn-primary">Track</button></form><div id="trackBox"></div>
</main>
<div id="site-footer"></div>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/dm.js"></script>
<script src="/assets/js/pages/track.js"></script>
</body>
</html>
