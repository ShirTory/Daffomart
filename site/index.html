<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groceries & Medicine Delivered</title>
  <meta name="description" content="Order groceries and medicine online with cash on delivery.">
  <link rel="icon" href="/assets/img/favicon.ico">
  <script>
    /* set dark/light theme BEFORE the page is drawn, so there is no white flash */
    (function () { try { var t = localStorage.getItem('dm_theme'); if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container main" id="main">
<div id="home"><p class="loading">Loading...</p></div>
</main>
<div id="site-footer"></div>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/dm.js"></script>
<script src="/assets/js/pages/home.js"></script>
</body>
</html>
