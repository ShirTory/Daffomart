<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | DaffoMart</title>
  <meta name="description" content="Login to your DaffoMart account.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1e3a8a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DaffoMart">
  <meta property="og:title" content="Login | DaffoMart">
  <meta property="og:description" content="Login to your DaffoMart account.">
  <link rel="icon" href="assets/img/favicon.ico">
  <script>
    /* set dark/light theme BEFORE the page is drawn, so there is no white flash */
    (function () {
      try {
        var t = localStorage.getItem('dm_theme');
        if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (err) { /* private mode: keep light theme */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container main" id="main">

<div class="auth-box card form-card narrow">
  <h1>Login</h1>
  <div id="loginError"></div>

  <form id="loginForm" novalidate>
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block">Login</button>
  </form>

  <p class="muted">New here? <a href="register.html">Create an account</a></p>
</div>
</main>

<div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/demo-sdk.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
